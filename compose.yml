services:
  bot:
    build: .
    env_file: .env
    # Run once, then exit. The local systemd timer starts one-off containers.
    command: ["python", "-m", "godot_rss_tg", "--once"]
    environment:
      STATE_DB_PATH: /data/seen.sqlite3
    volumes:
      - bot-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  bot-data:
