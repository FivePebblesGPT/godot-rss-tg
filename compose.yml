services:
  bot:
    build: .
    env_file: .env
    environment:
      STATE_DB_PATH: /data/seen.sqlite3
    volumes:
      - bot-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  bot-data:
